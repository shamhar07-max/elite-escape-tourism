<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elite Escape - Free Things to Do</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..900&family=Figtree:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Figtree', system-ui, -apple-system, sans-serif; }
    h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; }
    .bg-gradient-primary { background: linear-gradient(135deg, #283B90 0%, #53C9E0 100%); }
    .bg-gradient-accent { background: linear-gradient(135deg, #53C9E0 0%, #283B90 100%); }
    .btn-navy { background: #283B90; color: #FFFFFF; padding: 12px 24px; border-radius: 8px; font-family: 'Fraunces', Georgia, serif; font-weight: 700; text-decoration: none; transition: all 0.2s ease; display: inline-block; }
    .btn-navy:hover { background: #3b4cab; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(40,59,144,0.3); }
    .card { background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); border-radius: 16px; border: 1px rgba(255,255,255,0.2); }
    .gold-accent { color: #9BDCF5; }
  </style>
</head>
<body class="min-h-screen bg-white p-4 relative">
  <div class="bg-gradient-primary min-h-screen flex items-center justify-center p-4">
    <div class="card max-w-2xl w-full p-6 text-center shadow-2xl">
      <div class="mb-4">
        <span class="text-xs uppercase tracking-wider gold-accent">#FreeTravel</span>
      </div>
      <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-white mb-2">Something for Everyone</h1>
      <p class="text-lg text-white/90 mb-6 max-w-xl mx-auto">Free doesn't mean basic. Hidden gems, local secrets, zero-cost luxury experiences. 💎🆓</p>
      <a href="#" class="btn-navy">Explore Now</a>
    </div>
  </div>
  <div class="absolute bottom-0 left-0 right-0 p-4">
    <div class="bg-white/90 backdrop-blur-md rounded-2xl p-4 max-w-2xl mx-4 shadow-lg">
      <p class="text-sm text-gray-600 leading-relaxed">
        🆓 London: 9.7K free things · Zero-kid difficulty · Museum hours · Park trails · Sunset spots · Local insider tips
      </p>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elite Escape - E-SIM Travel Connect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Figtree:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Figtree', system-ui, -apple-system, sans-serif; }
    h1, h2, h3 { font-family: 'Montserrat', system-ui, -apple-system, sans-serif; }
    .bg-gradient-primary { background: linear-gradient(135deg, #283B90 0%, #53C9E0 100%); }
    .bg-gradient-accent { background: linear-gradient(135deg, #FFD32A 0%, #283B90 100%); }
    .btn-navy { background: #283B90; color: #FFFFFF; padding: 12px 24px; border-radius: 8px; font-family: 'Montserrat', sans-serif; font-weight: 700; text-decoration: none; transition: all 0.2s ease; display: inline-block; }
    .btn-navy:hover { background: #3b4cab; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(40,59,144,0.3); }
    .card { background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); border-radius: 16px; border: 1px rgba(255,255,255,0.2); }
    .gold-accent { color: #FFD32A; }
  </style>
</head>
<body class="min-h-screen bg-white p-4 relative">
  <div class="bg-gradient-primary min-h-screen flex items-center justify-center p-4">
    <div class="card max-w-2xl w-full p-6 text-center shadow-2xl">
      <div class="mb-4">
        <span class="text-xs uppercase tracking-wider gold-accent">#E-SIM</span>
      </div>
      <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-white mb-2">Connected Everywhere</h1>
      <p class="text-lg text-white/90 mb-6 max-w-xl mx-auto">Travel without borders. eSIM, instant activation, global coverage. Airalo, Holafly. Stay online in 190+ countries. 📱✈️</p>
      <a href="#" class="btn-navy">Get eSIM</a>
    </div>
  </div>
  <div class="absolute bottom-0 left-0 right-0 p-4">
    <div class="bg-white/90 backdrop-blur-md rounded-2xl p-4 max-w-2xl mx-4 shadow-lg">
      <p class="text-sm text-gray-600 leading-relaxed">
        📱 Airalo 10% off · Holafly unlimited · Activate in 2 minutes · No physical SIM · Stay online · 24/7 support · Travel smarter
      </p>
    </div>
  </div>
</body>
</html>
